[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipr"
version = "0.1.0"
description = "Agentic Information Path Routing: evidence-bound information compiler and online DAG runtime (reference POC)"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "sqlglot>=25",
  "pandas>=2.0",
  "altair>=5",
  "streamlit>=1.35",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
snowflake = ["snowflake-connector-python>=3.10"]
temporal = ["temporalio>=1.7"]
test = ["pytest>=8"]

[project.scripts]
ipr = "ipr.__main__:main"

[tool.setuptools.packages.find]
include = ["ipr*"]

[tool.setuptools.package-data]
ipr = ["catalog/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
